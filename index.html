<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STACKED — Strategic Card Combat</title>

    <!-- PWA — manifest auto-injected by vite-plugin-pwa; theme-color + Apple
         tags here so iOS Add-to-Home-Screen picks up the icon + standalone
         status bar cleanly. -->
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STACKED" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, etc.) — og:image MUST be
         absolute on the final domain; OG scrapers don't resolve relative URLs. -->
    <meta property="og:title" content="STACKED" />
    <meta property="og:description" content="A card game of stacks and consequences." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stackedthegame.com" />
    <meta property="og:image" content="https://stackedthegame.com/og-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="STACKED" />
    <meta name="twitter:description" content="A card game of stacks and consequences." />
    <meta name="twitter:image" content="https://stackedthegame.com/og-share.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
